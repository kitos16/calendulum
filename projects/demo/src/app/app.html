<main class="demo">
  <header class="demo__header">
    <h1>calendulum</h1>
    <p class="demo__tagline">
      Vista mensual reutilizable para Angular — standalone, signals, SCSS.
    </p>
  </header>

  <section class="demo__grid">
    <article class="demo__card">
      <h2 class="demo__card-title">Básico</h2>
      <calendulum-month [(value)]="selected" />
      <p class="demo__value" role="status">
        Seleccionado:
        {{ selected() ? (selected() | date: 'fullDate') : 'ninguno' }}
      </p>
    </article>

    <article class="demo__card demo__card--custom">
      <h2 class="demo__card-title">Personalizado</h2>
      <calendulum-month [showOutsideDays]="false" [dayCell]="dayCell" />
      <ng-template #dayCell let-day>
        <span class="day-cell" [class.day-cell--today]="day.isToday">
          {{ day.date.getDate() }}
        </span>
      </ng-template>
    </article>
  </section>
</main>
